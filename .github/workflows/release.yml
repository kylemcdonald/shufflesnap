# Builds the sdist and wheels on every v* tag (or manual dispatch) and publishes to PyPI
# through trusted publishing. Manual dispatches build and test only; publishing needs a tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - name: Test sdist install
        run: |
          python -m pip install "$(ls dist/*.tar.gz)[test]"
          cd "$RUNNER_TEMP" && python -m pytest -q "$GITHUB_WORKSPACE/tests"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*
          if-no-files-found: error

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v3.3.0
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/shufflesnap
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
